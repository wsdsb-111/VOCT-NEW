name: Release Regression

on:
  push:
  pull_request:

jobs:
  release-regression:
    name: Release Regression
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run release regression
        run: node scripts/test-release.js
