name: Release Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-regression:
    name: Release Regression
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Isolate test temporary directory
        run: |
          Write-Output ("Previous TEMP: " + $env:TEMP)
          $votcCiTemp = Join-Path (Get-Location).Path '.build\ci-temp'
          New-Item -ItemType Directory -Force -Path $votcCiTemp | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("TEMP=" + $votcCiTemp)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("TMP=" + $votcCiTemp)
          Write-Output ("Isolated test TEMP: " + $votcCiTemp)
      - name: Verify locked runtime dependencies
        run: node scripts/runtime-dependencies.js
      - name: Locate one browser for offline renderer checks
        run: |
          $v95BrowserCandidates = @(
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          )
          $v95Browser = $v95BrowserCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $v95Browser) { throw 'No installed Chromium browser available for offline UI checks.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('CHROME_PATH=' + $v95Browser)
      - name: Build runtime from source
        run: node scripts/build-runtime.js
      - name: Verify and materialize generated runtime
        id: materialize
        run: |
          node scripts/verify-runtime-build.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/deploy-runtime-build.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-runtime-build.js --deployed
      - name: Run release regression
        # Existing tests now exercise source-generated resources/app/out.
        run: node scripts/test-release.js
      - name: Cold-start complete Windows distribution
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: node scripts/test-v9.4-windows-packaged-smoke.js --launch --keep-temp
      - name: Preserve anonymous packaged smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: v94-packaged-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: .build/v9.4-construction/smoke-temp/**/evidence.json
          if-no-files-found: ignore
