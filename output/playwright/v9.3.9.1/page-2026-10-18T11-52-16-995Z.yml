          - heading "Rolling Summary Prompt" [level=4] [ref=f1e385]
          - button "Reset to default" [ref=f1e387]
        - paragraph [ref=f1e388]: This prompt is used when the conversation gets too long and needs to be compressed. It creates incremental summaries during the conversation.
        - textbox [ref=f1e389]: 更新之前的摘要，融入新消息的内容。创建一个连贯的摘要，包含之前的事件和新信息。 请按以下结构组织摘要： 1. **对话主题**：本次对话的核心议题 2. **关键事件**：讨论或发生的重要事件（保留具体细节：人名、地点、数字、日期） 3. **决策与承诺**：做出的决定、达成的协议、许下的承诺 4. **情感与关系**：角色之间的情感变化、关系发展 5. **后续计划**：提到的未来行动或计划 保持简洁但务必保留重要细节。使用中文撰写。
      - generic [ref=f1e390]:
        - generic [ref=f1e391]:
          - heading "Final Summary Prompt" [level=4] [ref=f1e392]
          - button "Reset to default" [ref=f1e394]
        - paragraph [ref=f1e395]: Used for the final perspective narrative; the final perspective narrative saved to the Legacy summary.
        - textbox [ref=f1e396]: 为这次对话创建高信息密度的中文最终摘要。 摘要不设置固定字数或段落数量；应根据原始对话的信息量，在当前配置的输出 Token 上限内完整保留细节。请在不遗漏实质内容、人物归属、因果关系和关键细节的前提下尽量精简，删去重复和低信息量措辞，不得为了凑长度虚构内容，也不得任意压缩成几句概述。按实际发生顺序组织连贯内容，并做到： 1. 每项言论、行动、观点、情绪和决定都明确归属于具体人物，不混淆多人视角。 2. 写清对话背景、时间、地点、事件先后及因果关系；保留确切人名、头衔、数字、日期、物件和关键措辞。 3. 记录每个人提出、接受、拒绝、隐瞒或计划的内容，包括请求、条件、承诺、协议、秘密、冲突与未决事项。 4. 描述语气和情绪如何变化，以及这些变化对信任、亲密、敌意、权力关系或后续行动的影响。 5. 只在措辞本身影响含义时保留简短原话；不要大段抄写，也不要重复同一事实。 6. 知情范围发生变化时必须分段；角色睡着、昏迷、离场、独处、自言自语、默想或实施未被他人察觉的行为时，不得把相关内容写成所有在场者共同知情。 不得笼统写成“双方讨论了某事”“关系有所发展”或“交换了意见”；必须说明谁说了什么、为何这样说、对方如何回应，以及最终达成或尚未解决的结果。
